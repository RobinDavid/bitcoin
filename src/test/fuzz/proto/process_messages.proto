syntax = "proto2";

import "util/net.proto";

package process_messages_fuzz;

message Peer {
  required proto_fuzz_util_net.Node node = 1;
  required proto_fuzz_util_net.NodeInfo nodeInfo = 2;
}

message ProcessMessage {
  required bytes random_message_type = 1;
  required uint32 time = 2;
  required bytes content = 3;
  required uint32 targetNode = 4;
}

message Target {
  repeated Peer peers = 1;
  repeated ProcessMessage msgs = 2;
}
