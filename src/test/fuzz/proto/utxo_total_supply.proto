syntax = "proto2";

package utxo_total_supply_fuzz;

message Target {
  required uint32 time = 1;
  required uint32 txoindex = 2;
  required uint32 duplicateCoinbaseHeight = 3;

  enum Action {
    ACTION_APPEND_LAST = 0;
    ACTION_ADD_TX = 1;
    ACTION_MINE = 2;
  }

  repeated Action actions = 4;
}
